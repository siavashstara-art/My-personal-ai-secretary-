name: Build Signed Release APK & AAB

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK, Debug APK & Release AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare signing keystore automatically
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare .env secrets automatically
        run: |
          if [ -n "${{ secrets.GITHUB_PERSONAL_TOKEN }}" ]; then
            printf 'GITHUB_PERSONAL_TOKEN=%s\n' "${{ secrets.GITHUB_PERSONAL_TOKEN }}" > .env
          else
            cp .env.example .env
          fi

      - name: Ensure google-services.json is in app/
        run: |
          if [ ! -f app/google-services.json ] && [ -f google-services.json ]; then
            cp google-services.json app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"373372102070","project_id":"gen-lang-client-0872918595"},"client":[{"client_info":{"mobilesdk_app_id":"1:373372102070:android:3b846065f0d66a4b5b0d17","android_client_info":{"package_name":"com.aistudio.creativestudio.xmzpqr"}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Cache & setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Release APK, Release AAB & Debug APK
        run: ./gradlew assembleRelease bundleRelease assembleDebug --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAICreativeStudio-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAICretiveStudio-Release-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAICreativeStudio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
